name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  policy-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22", cache-dependency-path: services/policy/go.sum }
      - name: gofmt and vet
        working-directory: services/policy
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - name: tests (includes the policy table tests)
        working-directory: services/policy
        run: go test ./... -count=1
      - name: policy table tests
        working-directory: services/policy
        run: go test ./policy -run 'TestPolicyTable|TestPolicyTableDocCoversAllPolicies' -count=1 -v

  receipts-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: install
        working-directory: services/receipts
        run: pip install -e ".[dev]"
      - name: lint
        working-directory: services/receipts
        run: ruff check . && ruff format --check .
      - name: tests
        working-directory: services/receipts
        run: python -m pytest -q

  dashboard-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/dashboard/package-lock.json }
      - name: install
        working-directory: apps/dashboard
        run: npm ci
      - name: types
        working-directory: apps/dashboard
        run: npx tsc --noEmit
      - name: module format (CommonJS pins)
        working-directory: apps/dashboard
        run: bash scripts/check_module_format.sh
      - name: tests
        working-directory: apps/dashboard
        run: npx vitest run
      - name: CSV golden-file tests
        working-directory: apps/dashboard
        run: npx vitest run test/csv.test.ts

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: make contracts
      - name: generated files are up to date
        run: git diff --exit-code

  evals-and-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22", cache-dependency-path: services/policy/go.sum }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/dashboard/package-lock.json }
      - run: pip install -e "services/receipts[dev]" pyyaml
      - run: npm ci
        working-directory: apps/dashboard
      - name: eval harness unit tests, hook tests
        run: |
          python -m pytest -q evals/tests observability/tests sandbox/tests
          python scripts/hooks/test_hooks.py
      - name: end to end smoke test
        run: python scripts/e2e.py
      - name: eval dry run (setup fails, reference passes, no violations)
        run: python evals/run_evals.py --dry-run
