# Receives Claude Code OTLP telemetry and writes it to a file (for viewer.py) and a Prometheus endpoint.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}

exporters:
  file:
    path: /data/telemetry.jsonl
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  pipelines:
    metrics: { receivers: [otlp], processors: [batch], exporters: [file, prometheus] }
    logs: { receivers: [otlp], processors: [batch], exporters: [file, debug] }
