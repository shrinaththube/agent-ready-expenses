# The dev container has NO route to the internet: it sits on an `internal` network whose only other member is the
# egress proxy. The proxy holds the real secrets; the dev container only has placeholders.
#   REAL_REIMBURSE_KEY=... docker compose -f sandbox/docker-compose.yml up -d
services:
  proxy:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "sandbox/proxy/egress_proxy.py", "--port", "8080", "--log", "/logs/egress.jsonl"]
    environment:
      PROXY_BIND_ALL: "1"
      PLACEHOLDER_REIMBURSE_KEY: "PLACEHOLDER_REIMBURSE_KEY"
      REAL_REIMBURSE_KEY: "${REAL_REIMBURSE_KEY:-}"   # from your shell, never committed
    volumes:
      - ..:/app:ro
      - ./logs:/logs
    networks: [internal, egress]
  dev:
    build:
      context: ..
      dockerfile: sandbox/Dockerfile
    command: sleep infinity
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      HTTP_PROXY: http://proxy:8080
      HTTPS_PROXY: http://proxy:8080
      NO_PROXY: localhost,127.0.0.1
      REIMBURSE_API_KEY: PLACEHOLDER_REIMBURSE_KEY   # placeholder only
    networks: [internal]
    depends_on: [proxy]
networks:
  internal:
    internal: true      # no default route out
  egress: {}
